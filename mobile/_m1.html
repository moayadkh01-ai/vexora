<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>نواركيو | NoirCue — نسخة الجوال</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M48 4 L86 26 V70 L48 92 L10 70 V26 Z' fill='url(%23g)'/%3E%3Cpath d='M25 32 H38 L48 54 L58 32 H71 L48 76 Z' fill='%2305070f'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#05070f;--surface:rgba(16,19,38,.82);--line:rgba(150,163,220,.14);--line2:rgba(150,163,220,.3);
  --text:#eef1fb;--muted:#98a2c0;--violet:#8b5cf6;--cyan:#22d3ee;--gold:#ffc945;--green:#34d399;--red:#fb7185;
  --grad:linear-gradient(135deg,#8b5cf6,#6366f1 48%,#22d3ee);--grad-gold:linear-gradient(135deg,#ffe08a,#f59e0b);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;background:radial-gradient(700px 420px at 85% -10%,rgba(99,102,241,.16),transparent 60%),radial-gradient(600px 400px at -10% 40%,rgba(139,92,246,.12),transparent 60%),var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;color:inherit}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.wrap{width:min(520px,100% - 24px);margin-inline:auto}
#root{padding-bottom:86px}
.appbar{position:sticky;top:0;z-index:40;background:rgba(5,7,15,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.appbar-in{display:flex;align-items:center;gap:10px;height:58px}
.coinpill{display:flex;align-items:center;gap:6px;padding:7px 12px 7px 8px;border-radius:99px;background:rgba(255,201,69,.09);border:1px solid rgba(255,201,69,.32);color:var(--gold);font-weight:800;font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:13px;font-weight:800;font-size:14px;transition:.15s;border:1px solid transparent}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(99,102,241,.35)}
.btn.primary:active{transform:scale(.97)}
.btn.ghost{border-color:var(--line2);background:rgba(255,255,255,.03)}
.btn.gold{background:var(--grad-gold);color:#241a02}
.btn.small{padding:8px 14px;font-size:12.5px;border-radius:11px}
.btn.wfull{width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--cyan)}
h2.title{font-size:19px;font-weight:900;margin:6px 0 2px}
.sub{color:var(--muted);font-size:12.5px;line-height:1.7}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--muted);margin-bottom:6px;text-transform:uppercase}
.inp input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:rgba(10,13,28,.7);color:var(--text);font-size:15px;outline:none}
.inp input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(139,92,246,.16)}
.fmsg{color:var(--red);font-size:11.5px;margin-top:5px;display:none}
.fmsg.show{display:block}
.ava{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff;background:var(--grad);flex-shrink:0}
.ava.lg{width:74px;height:74px;border-radius:22px;font-size:32px}
.gcard{display:flex;align-items:center;gap:13px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);margin-bottom:10px}
.gcard:active{transform:scale(.985)}
.gico{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gcard b{font-size:15px}
.gcard .onl{font-size:11.5px;color:var(--muted)}
.stat-row{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;border-bottom:1px solid rgba(150,163,220,.09);font-size:13.5px}
.stat-row:last-child{border:none}
.stat-row b{font-size:14px}
.tx-row{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid rgba(150,163,220,.09);font-size:13px}
.tx-row:last-child{border:none}
.plus{color:var(--green);font-weight:900}.minus{color:var(--red);font-weight:900}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(6,8,18,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:9.5px;font-weight:800}
.bottom-nav a.active{color:var(--cyan)}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);z-index:200;background:#0d1126;border:1px solid var(--line2);border-radius:14px;padding:11px 18px;font-size:13px;max-width:88vw;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.c4-board{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:linear-gradient(160deg,#141936,#0d1126);padding:11px;border-radius:16px;border:1px solid var(--line2);margin:12px auto;max-width:340px}
.c4-cell{aspect-ratio:1;border-radius:50%;background:rgba(5,7,15,.85);box-shadow:inset 0 2px 6px rgba(0,0,0,.55)}
.c4-cell.p1{background:radial-gradient(circle at 35% 30%,#7de7f7,#0891b2);box-shadow:0 0 12px rgba(34,211,238,.5)}
.c4-cell.p2{background:radial-gradient(circle at 35% 30%,#c4b5fd,#6d28d9);box-shadow:0 0 12px rgba(139,92,246,.55)}
.c4-cell.win{animation:wp .8s infinite}@keyframes wp{50%{transform:scale(1.13)}}
.c4-cell.hint{outline:2px dashed rgba(34,211,238,.5);outline-offset:-2px}
.rv-board{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;background:linear-gradient(160deg,#0d3b2e,#07271e);padding:9px;border-radius:15px;border:1px solid rgba(52,211,153,.32);margin:12px auto;max-width:340px}
.rv-cell{aspect-ratio:1;border-radius:50%;background:rgba(5,20,14,.65)}
.rv-cell.hint{outline:2px dashed rgba(34,211,238,.55);outline-offset:-2px}
.rv-cell.p1{background:radial-gradient(circle at 35% 30%,#1f2937,#04060d)}
.rv-cell.p2{background:radial-gradient(circle at 35% 30%,#f8fafc,#cbd5e1)}
.gstatus{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:13px;padding:11px 14px;font-size:13.5px;font-weight:700}
.dotp{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:-2px;margin-inline-end:6px}
.d1{background:radial-gradient(circle at 35% 30%,#7de7f7,#0891b2)}.d2{background:radial-gradient(circle at 35% 30%,#c4b5fd,#6d28d9)}
.pack-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pack{padding:14px 10px;border-radius:15px;border:1px solid var(--line);background:var(--surface);text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.pack .coins{font-weight:900;font-size:15px;color:var(--gold)}
.pack .price{font-size:11.5px;color:var(--muted)}
.cos-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cos{padding:13px;border-radius:15px;border:1px solid var(--line);background:var(--surface);text-align:center;display:flex;flex-direction:column;gap:7px;align-items:center;font-size:12.5px}
.owned{border-color:rgba(52,211,153,.4)}
.tabs{display:flex;gap:5px;padding:5px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:13px;overflow-x:auto;margin:12px 0}
.tabs button{padding:8px 13px;border-radius:10px;font-size:12.5px;font-weight:800;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--grad);color:#fff}
.xp-bar{height:8px;border-radius:99px;background:rgba(150,163,220,.14);overflow:hidden;margin-top:6px}
.xp-bar i{display:block;height:100%;background:var(--grad);border-radius:99px}
.ach{display:flex;gap:10px;align-items:center;padding:9px 2px;font-size:13px}
.ach.locked{opacity:.4}
.boot{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(500px 340px at 50% 30%,#0b0f24,#05070f)}
.wm{font-size:30px;font-weight:900;letter-spacing:.3em;text-indent:.3em}
.wm span{opacity:0;animation:li .5s forwards}
@keyframes li{to{opacity:1}}
.tagline{font-size:10.5px;color:var(--muted);letter-spacing:.4em;text-indent:.4em;text-transform:uppercase}
.bbar{width:210px;height:5px;border-radius:99px;background:rgba(150,163,220,.15);overflow:hidden}
.bbar i{display:block;height:100%;width:0;background:var(--grad);animation:bl 1.6s ease forwards}
@keyframes bl{to{width:100%}}
.viptag{font-size:9.5px;font-weight:900;padding:3px 9px;border-radius:99px;background:var(--grad-gold);color:#241a02}
.modal-ov{position:fixed;inset:0;z-index:150;background:rgba(3,5,14,.85);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.modal{width:min(480px,100%);background:#0b0e1f;border:1px solid var(--line2);border-radius:22px 22px 14px 14px;padding:20px;animation:min .22s}
@keyframes min{from{transform:translateY(30px);opacity:0}}
.warn-note{font-size:11px;color:var(--gold);background:rgba(255,201,69,.07);border:1px dashed rgba(255,201,69,.35);border-radius:10px;padding:8px 11px;line-height:1.7;margin-top:10px}
.section{margin-top:18px}
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts"></div>
<div id="modal-root"></div>
</body>
</html>
